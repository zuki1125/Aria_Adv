# ============================================================
# ワールド設定ファイル
# ここを編集するだけでシナリオの世界観・NPCを変更できます
# ============================================================

# ----------------------------
# 世界観の概要
# ----------------------------
world:
  name: エルドリア大陸
  description: >
    魔法と剣が共存する中世風ファンタジー世界。
    かつて古代文明が残した遺跡が各地に点在し、冒険者たちが挑んでいる。
    現在は各国が表向き平和を保っているが、裏では勢力争いが続いている。

# ----------------------------
# 国・地域の設定
# ----------------------------
locations:
  - name: アルディア王国
    type: 国
    description: >
      大陸中央に位置する大国。豊かな農地と強力な騎士団を持つ。
      王都レギオスを中心に商業・文化が栄えている。

  - name: レギオス（王都）
    type: 都市
    description: >
      アルディア王国の首都。高い城壁と石畳の大通りで知られる。
      冒険者ギルド本部があり、国中から腕に覚えのある者が集まる。
      アリアが物語の冒頭で初めて訪れた場所。

  - name: ハルン村
    type: 村
    description: >
      アリアの故郷。王都から馬で2日ほど東にある小さな農村。
      平和な村だが、若者には刺激が少なく、アリアは冒険の夢を抱いて旅立った。

# ----------------------------
# NPCの設定
# ----------------------------
npcs:
  - name: ガルド・アイアンシールド
    occupation: 王都騎士団長
    age: 45
    personality: 厳格だが公正。実力のある者には出身を問わず目をかける。口数は少ない。
    relationship: アリアとは王都の門でばったり出会ったばかり。まだ面識は薄い。

  - name: ミラ
    occupation: 冒険者ギルドの受付嬢
    age: 22
    personality: 明るく世話好き。新人冒険者の扱いに慣れており、アリアの面倒をよく見ている。
    relationship: アリアが王都に着いて最初に話しかけた人物。親しみを持っている。

  - name: ゼノ
    occupation: 謎の行商人
    age: 不明（見た目は30代）
    personality: 飄々としており本心が読めない。珍しい品を扱うが、情報も売る。
    relationship: アリアとはまだ出会っていない。
